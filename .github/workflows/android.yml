# Android APK の自動ビルド（テスト → APK 作成 → ダウンロード用に公開）
#   - push / 手動実行（Actions タブの「Run workflow」）で動く
#   - 毎回のAPKは Actions の実行結果（Artifacts）に保存される
#   - さらに Releases の「debug-latest」を最新のAPKで置き換える（スマホからも直接ダウンロードできる）
# 署名: 毎回同じ鍵で署名し、上書きインストールできるようにする（鍵の扱いは下の「署名の鍵」の手順を参照）。
name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot と エクスポートテンプレートを用意（キャッシュ）
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Godot をダウンロード
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Godot を PATH に追加
        run: |
          mkdir -p ~/bin && ln -sf ~/godot/godot ~/bin/godot
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Android SDK（build-tools 34 / platform 34）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null

      # 署名の鍵は毎回同じものを使う（上書きインストールのため）。優先順位:
      #   1) シークレット DEBUG_KEYSTORE_BASE64  2) Actions のキャッシュに保管した鍵  3) 初回のみ新規作成してキャッシュに保管
      # 鍵はリポジトリには保存しない。キャッシュは7日間使われないと消えるため、恒久的にはシークレットへの登録を推奨。
      - name: 署名の鍵をキャッシュから復元
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: デバッグ署名の鍵
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "${DEBUG_KEYSTORE_BASE64}" | base64 -d > ~/.android/debug.keystore
            echo "シークレットの鍵を使用"
          elif [ -f ~/.android/debug.keystore ]; then
            echo "キャッシュに保管した鍵を使用"
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "::notice::署名の鍵を新しく作成し、キャッシュに保管します（以後のビルドはこの鍵で署名）"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:"

      - name: 新しく作った鍵をキャッシュに保管
        if: steps.keystore.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Godot のエディタ設定（SDK・JDK・鍵の場所）
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # アプリにビルド番号を書き込む（タイトル画面の更新確認で使う）。Android の versionCode も実行番号にする
      - name: ビルド番号を書き込む
        run: |
          printf '{"build": %d, "sha": "%s"}\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" > build_info.json
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          cat build_info.json; grep "^version/code" export_presets.cfg

      - name: テスト（データ検証・ユニット・E2E）
        run: tools/run_tests.sh

      - name: APK を作成
        run: tools/build_android.sh debug

      - name: 署名の検証
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs build/android/ocean_frontier_debug.apk | head -3
          ls -la build/android/

      - name: Artifacts に保存
        uses: actions/upload-artifact@v4
        with:
          name: ocean_frontier_debug_${{ github.run_number }}
          path: build/android/ocean_frontier_debug.apk
          retention-days: 30

      - name: Releases の「debug-latest」を更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # アプリが読む更新情報（最新のビルド番号とダウンロード先）
          python3 - <<PY
          import json, subprocess
          subject = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          json.dump({"build": ${{ github.run_number }}, "sha": "${GITHUB_SHA::7}", "notes": "更新内容: " + subject,
                     "apk_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/ocean_frontier_debug.apk"},
                    open("build/android/version.json", "w"), ensure_ascii=False)
          PY
          cat build/android/version.json
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest build/android/ocean_frontier_debug.apk build/android/version.json \
            --target "${GITHUB_SHA}" --prerelease \
            --title "最新のデバッグ版 (#${{ github.run_number }})" \
            --notes "ブランチ ${GITHUB_REF_NAME} / コミット ${GITHUB_SHA::7} から自動ビルドしたデバッグ版APKです。Androidで開くとインストールできます（提供元不明のアプリの許可が必要）。"
