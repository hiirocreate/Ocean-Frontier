# Android APK の自動ビルド（テスト → APK 作成 → ダウンロード用に公開）
#   - push / 手動実行（Actions タブの「Run workflow」）で動く
#   - 毎回のAPKは Actions の実行結果（Artifacts）に保存される
#   - さらに Releases の「debug-latest」を最新のAPKで置き換える（スマホからも直接ダウンロードできる）
# 署名: リポジトリのシークレット DEBUG_KEYSTORE_BASE64（debug.keystore を base64 にしたもの）があればそれを使う。
#       無ければ実行ごとに作る（その場合、更新インストールのたびにアンインストールが必要）。
#       鍵そのものはリポジトリに保存しない。
name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot と エクスポートテンプレートを用意（キャッシュ）
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Godot をダウンロード
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Godot を PATH に追加
        run: |
          mkdir -p ~/bin && ln -sf ~/godot/godot ~/bin/godot
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Android SDK（build-tools 34 / platform 34）
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null

      - name: デバッグ署名の鍵
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "${DEBUG_KEYSTORE_BASE64}" | base64 -d > ~/.android/debug.keystore
            echo "シークレットのデバッグ鍵を使用"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "::warning::DEBUG_KEYSTORE_BASE64 が未設定のため、実行ごとに新しい鍵で署名しています（上書き更新できません）"
          fi

      - name: Godot のエディタ設定（SDK・JDK・鍵の場所）
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: テスト（データ検証・ユニット・E2E）
        run: tools/run_tests.sh

      - name: APK を作成
        run: tools/build_android.sh debug

      - name: 署名の検証
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs build/android/ocean_frontier_debug.apk | head -3
          ls -la build/android/

      - name: Artifacts に保存
        uses: actions/upload-artifact@v4
        with:
          name: ocean_frontier_debug_${{ github.run_number }}
          path: build/android/ocean_frontier_debug.apk
          retention-days: 30

      - name: Releases の「debug-latest」を更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest build/android/ocean_frontier_debug.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "最新のデバッグ版 (#${{ github.run_number }})" \
            --notes "ブランチ ${GITHUB_REF_NAME} / コミット ${GITHUB_SHA::7} から自動ビルドしたデバッグ版APKです。Androidで開くとインストールできます（提供元不明のアプリの許可が必要）。"
